name: Decode toolbar icons

on:
  push:
    paths:
      - "icons/png-base64.json"
      - ".github/workflows/decode-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode PNG icons into chrome/ and firefox/
        run: |
          python3 << 'PY'
          import json, base64
          from pathlib import Path
          data = json.loads(Path("icons/png-base64.json").read_text())
          for name, b64 in data.items():
              raw = base64.b64decode(b64)
              for folder in (Path("chrome/icons"), Path("firefox/icons")):
                  folder.mkdir(parents=True, exist_ok=True)
                  dest = folder / name
                  dest.write_bytes(raw)
                  print(f"wrote {dest} ({len(raw)} bytes)")
          PY

      - name: Commit decoded icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chrome/icons/*.png firefox/icons/*.png
          if git diff --cached --quiet; then
            echo "No icon changes"
          else
            git commit -m "Add decoded toolbar icons"
            git push
          fi
